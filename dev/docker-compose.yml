# Local/development full-stack environment used by liki-web/scripts/docker-test.sh.

services:
  engine-mcp:
    image: ${LIKI_ENGINE_IMAGE:?LIKI_ENGINE_IMAGE is required}
    entrypoint: ["/usr/local/bin/engine-mcp", "--addr", ":8085"]
    expose: ["8085"]
    restart: "no"
    environment:
      - LISTEN_ADDR=:8085
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1"

  web:
    image: liki-web:local
    build:
      context: ..
      dockerfile: Dockerfile
    expose: ["8081"]
    restart: "no"
    env_file:
      - ${LIKI_TEST_ENV_FILE:-/tmp/liki-web-e2e.env}
    environment:
      - LIKI_HTTP_LISTEN_ADDRESS=:8081
      - LIKI_DATA_DIR=/var/lib/liki
      - LIKI_ENGINE_MCP_URL=http://engine-mcp:8085
      # 容器内 127.0.0.1 无 agent：本地 compose 不做真实对话，仅 e2e mock 前端。
      - LIKI_EXPERTS_URL=${LIKI_EXPERTS_URL:-http://127.0.0.1:18083}
      - LIKI_EXPERTS_NATAL_URL=${LIKI_EXPERTS_NATAL_URL:-http://127.0.0.1:18083}
      - LIKI_EXPERTS_DIVINATION_URL=${LIKI_EXPERTS_DIVINATION_URL:-http://127.0.0.1:18083}
      - LIKI_EXPERTS_FENGSHUI_URL=${LIKI_EXPERTS_FENGSHUI_URL:-http://127.0.0.1:18083}
      - LIKI_EXPERTS_NAMING_URL=${LIKI_EXPERTS_NAMING_URL:-http://127.0.0.1:18083}
      - LIKI_EXPERTS_TOKEN=${LIKI_EXPERTS_TOKEN:?LIKI_EXPERTS_TOKEN is required}
    tmpfs:
      - /var/lib/liki:uid=1000,gid=1000,mode=0700
    depends_on:
      engine-mcp:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    environment:
      - CADDY_LISTEN_ADDR=:80
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /data
    depends_on:
      web:
        condition: service_started
