name: Promote release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix'
        required: true
        type: string
      source_commit:
        description: 'Full Git commit SHA that was tested'
        required: true
        type: string
      digests_json:
        description: 'Contents of build/candidate/candidate-digests.json'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-promote-release-web-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote tested digest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref_type == 'tag' && github.ref_name == format('v{0}', inputs.version)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - id: manifest
        name: Validate tag, commit, and digest manifest
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          DIGESTS_JSON: ${{ inputs.digests_json }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            :
          else
            echo "::error::version must use CalVer YYYY.MM.DD.N" >&2
            exit 1
          fi
          expected_tag="v$VERSION"
          if [ "${GITHUB_REF_TYPE}" != tag ] || [ "${GITHUB_REF_NAME}" != "$expected_tag" ]; then
            echo "::error::workflow must be dispatched on tag $expected_tag" >&2
            exit 1
          fi

          actual_commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$actual_commit" != "$SOURCE_COMMIT" ]; then
            echo "::error::tag $expected_tag points to $actual_commit, expected $SOURCE_COMMIT" >&2
            exit 1
          fi

          if ! printf '%s' "$DIGESTS_JSON" | jq -e '
            .repository == "ml8s/liki-web" and
            .source_commit == $source_commit and
            (.images | type == "object" and keys == ["web"])
          ' --arg source_commit "$SOURCE_COMMIT" >/dev/null; then
            echo '::error::invalid digest manifest' >&2
            exit 1
          fi

          digest="$(printf '%s' "$DIGESTS_JSON" | jq -er '.images.web')"
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo '::error::images.web must be a lowercase sha256 digest' >&2
            exit 1
          fi

          {
            echo "digest=$digest"
            echo "source_commit=$actual_commit"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: promote
        name: Promote exact digest to release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          digest="${{ steps.manifest.outputs.digest }}"
          source="ghcr.io/ml8s/liki-web@$digest"
          target="ghcr.io/ml8s/liki-web:v${VERSION}"
          docker buildx imagetools create -t "$target" "$source"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Sign promoted exact digest
        env:
          OIDC_AUDIENCE: sigstore
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/ml8s/liki-web@$IMAGE_DIGEST"
          oidc_token="$(
            curl -fsSL \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              -H 'Accept: application/json' \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" |
              jq -er '.value'
          )"
          cosign sign --yes --identity-token "$oidc_token" "$image"

      - name: Verify promoted exact digest
        env:
          VERSION: ${{ inputs.version }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\\.com/ml8s/liki-web/\\.github/workflows/promote-release\\.yml@refs/tags/v${VERSION}$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/ml8s/liki-web@$IMAGE_DIGEST"

      - name: Record release evidence
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.manifest.outputs.source_commit }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          mkdir -p release-evidence
          printf 'source_commit=%s\nimage_digest=%s\n' "$SOURCE_COMMIT" "$IMAGE_DIGEST" \
            > "release-evidence/liki-web-v${VERSION}.env"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: liki-web-release-evidence-v${{ inputs.version }}
          path: release-evidence/**
          retention-days: 30
          if-no-files-found: error
