name: Release

# Tag-driven release for ml8s/liki-web. Builds and signs the release image,
# then publishes this tag's GitHub Release. The release asset
# `candidate-digests.json` is the cross-repository contract that liki-deploy
# consumes; this workflow never deploys anything.

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Guard release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "::error::tag $tag is not CalVer vYYYY.MM.DD.N" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $tag does not point at a main commit" >&2
            exit 1
          fi
          version_file="$(cat cmd/liki-web/VERSION)"
          if [ "$version_file" != "${tag#v}" ]; then
            echo "::error::tag $tag does not match cmd/liki-web/VERSION=$version_file" >&2
            exit 1
          fi
          if docker buildx imagetools inspect "ghcr.io/ml8s/liki-web:$tag" >/dev/null 2>&1; then
            echo "::error::ghcr.io/ml8s/liki-web:$tag already exists; release tags are immutable" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub release $tag already exists" >&2
            exit 1
          fi

      - uses: ./.github/actions/prepare-skills
        with:
          liki-release-tag: ${{ vars.LIKI_SKILLS_RELEASE_TAG }}
          liki-bundle-sha256: ${{ vars.LIKI_SKILLS_BUNDLE_SHA256 }}
          github-token: ${{ github.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/app/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Install Python check dependencies
        run: python -m pip install pyyaml==6.0.3

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd app && npm ci

      - uses: ./.github/actions/install-caddy
        with:
          version: "2.10.2"
          sha512: "747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --timeout=3m

      - name: Release gate
        run: make gate

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Build and push release image
        id: images
        run: RELEASE_VERSION="${GITHUB_REF_NAME#v}" scripts/release-images.sh

      - name: Sign and verify release image
        run: |
          set -euo pipefail
          digest="${{ steps.images.outputs.web_digest }}"
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          echo "── signing ghcr.io/ml8s/liki-web@$digest ──"
          cosign sign --yes "ghcr.io/ml8s/liki-web@$digest"
          cosign verify "ghcr.io/ml8s/liki-web@$digest" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "liki-web $GITHUB_REF_NAME" \
            --generate-notes \
            build/release/candidate-digests.json
