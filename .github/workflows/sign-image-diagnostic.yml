name: Sign image diagnostic

on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Image digest to sign, e.g. sha256:...'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: sign-image-${{ github.event.inputs.digest }}
  cancel-in-progress: false

jobs:
  sign:
    name: Diagnose and sign image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIGEST: ${{ inputs.digest }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/liki-web
    steps:
      - name: Check GitHub OIDC injection
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is missing" >&2
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_TOKEN is missing" >&2
            exit 1
          fi
          echo "OIDC endpoint is configured"

      - name: Inspect OIDC identity claims
        run: |
          set -euo pipefail
          response="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" > "$response"
          python3 -c 'import base64,json,sys; response=json.load(open(sys.argv[1])); token=response["value"]; payload=token.split(".")[1]; payload += "=" * (-len(payload) % 4); claims=json.loads(base64.urlsafe_b64decode(payload)); [print(f"{key}={claims.get(key)}") for key in ("iss","aud","sub","repository","repository_owner","ref","sha","job_workflow_ref","runner_environment")]; assert claims.get("repository") == "ml8s/liki-web"' "$response"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.4.1

      - name: Inspect artifact
        run: docker buildx imagetools inspect "${IMAGE}@${DIGEST}"

      - name: Sign artifact with explicit OIDC token
        run: |
          set -euo pipefail
          response="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" > "$response"
          oidc_token="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["value"])' "$response")"
          cosign sign --yes --verbose --identity-token "$oidc_token" "${IMAGE}@${DIGEST}"

      - name: Verify signed artifact
        run: |
          cosign verify --verbose \
            --certificate-identity-regexp '^https://github\.com/ml8s/liki-web/\.github/workflows/.*\.yml@refs/heads/main' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
