name: Security scans

# 依赖/文件系统漏洞扫描：从 push CI 拆出为每日定时 + 手动触发。
# push 门禁保留静态契约检查（action SHA pin、secrets、打包完整性），
# 扫描类偏环境依赖数据、变化慢，nightly 足以覆盖且不占 PR 墙钟。
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-audit:
    name: Node dependency audit
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/app/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Audit Astro / legacy web dependencies
        run: |
          cd web
          npm ci
          npm audit --audit-level=high
      - name: Audit Vue app dependencies
        run: |
          cd web/app
          npm ci
          npm audit --audit-level=high

  filesystem-vulnerabilities:
    name: Filesystem vulnerability scan
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
