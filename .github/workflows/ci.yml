name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── check：对应 make check ──
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/app/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd app && npm ci

      - name: Install caddy
        uses: ./.github/actions/install-caddy
        with:
          version: "2.10.2"
          sha512: "747df7ee74de188485157a383633a1a963fd9233b71fbb4a69ddcbcc589ce4e2cc82dacf5dbbe136cb51d17e14c59daeb5d9bc92487610b0f3b93680b2646546"

      - name: Lint Go (golangci-lint-action)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=3m

      - name: make check (lint-go skipped, done by action above)
        run: |
          go vet ./...
          make fmt-check lint-js lint-docs typecheck check-web-static check-security check-caddy check-actions

  # ── race：Go 竞态检测（并行，从覆盖率闸门拆出：语义保留、墙钟不增）──
  race:
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Go race detector
        run: make test-go-race

  # ── test：对应 make test-go + test-js + test-python + build + check-packaging（e2e 单独 job）──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            web/app/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd app && npm ci

      - name: Go test + coverage
        run: make test-go-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out

      - name: Vitest + coverage
        run: make test-js-coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: web/app/coverage
          if-no-files-found: error

      - name: Install static site dependencies
        run: cd web && npm ci

      - name: Static site tests
        run: cd web && npm run test

      - name: Python helper tests
        run: make test-python
