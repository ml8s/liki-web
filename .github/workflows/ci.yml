name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── check：对应 make check ──
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-skills
        with:
          liki-release-tag: ${{ vars.LIKI_SKILLS_RELEASE_TAG }}
          liki-bundle-sha256: ${{ vars.LIKI_SKILLS_BUNDLE_SHA256 }}
          github-token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd app && npm ci

      - name: Install caddy
        run: |
          curl -sfL "https://caddyserver.com/api/download?os=linux&arch=amd64" -o /usr/local/bin/caddy
          chmod +x /usr/local/bin/caddy

      - name: Lint Go (golangci-lint-action)
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.13.1
          args: --timeout=3m

      - name: make check (lint-go skipped, done by action above)
        run: |
          go vet ./...
          make lint-js typecheck check-html check-security check-caddy check-skills check-version

  # ── test：对应 make test-go + test-js + test-python + build + check-packaging（e2e 单独 job）──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-skills
        with:
          liki-release-tag: ${{ vars.LIKI_SKILLS_RELEASE_TAG }}
          liki-bundle-sha256: ${{ vars.LIKI_SKILLS_BUNDLE_SHA256 }}
          github-token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd app && npm ci

      - name: Go test + coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./... -coverpkg=./internal/...
          COV=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COV}%"
          if [ "$(echo "$COV < 60" | bc)" -eq 1 ]; then
            echo "❌ Coverage ${COV}% < 60%"; exit 1
          fi

      - name: Vitest
        run: make test-js

      - name: Python helper tests
        run: make test-python

      - name: Build
        run: make build

      - name: Packaging check
        run: make check-packaging

  # ── e2e：Playwright 全栈 ──
  e2e:
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-skills
        with:
          liki-release-tag: ${{ vars.LIKI_SKILLS_RELEASE_TAG }}
          liki-bundle-sha256: ${{ vars.LIKI_SKILLS_BUNDLE_SHA256 }}
          github-token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Node deps
        run: cd web && npm ci

      - name: Install Playwright browsers
        run: cd web && npx playwright install chromium

      - name: Install Caddy
        run: |
          curl -sfL "https://caddyserver.com/api/download?os=linux&arch=amd64" -o caddy
          chmod +x caddy

      - name: Build
        run: make build-go build-web

      - name: Start servers
        env:
          JWT_SECRET: liki-ci-e2e-secret-0123456789abcdef
          REFERRAL_PAYOUT_SECRET: liki-ci-e2e-referral-payout-secret-0123456789abcdef
          LISTEN_ADDR: :8081
          RETURN_URL: http://localhost:8080
          LIKI_LLM_API_KEY: ci-test-dummy
          LIKI_LLM_MODEL: ci-test-dummy
          XUNHU_APPID: ci-test-dummy
          XUNHU_APPSECRET: ci-test-dummy
          PAYMENTS_WEBHOOK_URL: http://localhost:8081/api/payments/webhook
          LIKI_AGENTS_URL: http://127.0.0.1:18083
          LIKI_AGENTS_INTERNAL_TOKEN: liki-ci-e2e-agent-secret
          LIKI_WEB_HOST: localhost
          LIKI_ENGINE_HOST: localhost
        run: |
          mkdir -p /tmp/liki-e2e && chmod 777 /tmp/liki-e2e
          LIKI_DATA_DIR=/tmp/liki-e2e ./bin/liki-web &
          for i in $(seq 1 10); do
            curl -sf http://localhost:8081/api/health 2>/dev/null | grep -q '"ok"' && echo "Go ready" && break
            sleep 1
          done
          if [ "$i" = "10" ]; then echo "Go server failed" >&2; exit 1; fi
          ./caddy run --config dev/Caddyfile.local &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/zh-Hans/ 2>/dev/null | grep -q '<html' && \
            curl -sf http://localhost:8080/api/health 2>/dev/null | grep -q '"ok"' && \
            { echo "Server ready"; break; }
            sleep 2
          done
          if [ "$i" = "30" ]; then echo "Server failed" >&2; exit 1; fi

      - name: Run E2E
        run: cd web && BASE_URL=http://localhost:8080 npx playwright test --config e2e/playwright.config.js --ignore-snapshots

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/

  docker-publish:
    name: Publish web image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [check, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-skills
        with:
          liki-release-tag: ${{ vars.LIKI_SKILLS_RELEASE_TAG }}
          liki-bundle-sha256: ${{ vars.LIKI_SKILLS_BUNDLE_SHA256 }}
          github-token: ${{ github.token }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web && npm ci
          cd app && npm ci

      - name: Build artifacts (bin + web dist + skills)
        run: |
          make build-sitemap
          make build-go
          make build-web

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "runtime=$(cat cmd/liki-web/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          id: web-image
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/liki-web:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/liki-web:${{ steps.version.outputs.runtime }}
      - name: Record released image digest
        run: echo "liki-web=${{ steps.web-image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke web image
        run: |
          trap 'docker rm -f web-smoke 2>/dev/null || true' EXIT
          docker run -d --name web-smoke \
            -e LISTEN_ADDR=:8081 \
            -e JWT_SECRET=ci-smoke-secret \
            -e LIKI_LLM_API_KEY=ci-smoke \
            -e LIKI_LLM_MODEL=ci-smoke \
            -e LIKI_LLM_BASE_URL=https://validation.invalid/v1 \
            -e LIKI_AGENTS_URL=http://127.0.0.1:18083 \
            -e LIKI_AGENTS_INTERNAL_TOKEN=ci-smoke-agent-token \
            -e LIKI_SKILLS_DIR=/web/skills \
            -p 18081:8081 \
            ghcr.io/${{ github.repository_owner }}/liki-web:${{ steps.version.outputs.runtime }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/api/health 2>/dev/null | grep -q '"ok"' && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/api/health | grep -q '"ok"' || { echo "web smoke failed"; exit 1; }
          echo "✓ web image smoke passed"
