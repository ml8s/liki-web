name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # skills 准备（结构校验 + 指纹防假同步）统一在 composite action
      - uses: ./.github/actions/prepare-skills
      - name: Validate skills
        run: |
          test -f "web/skills/liki/SKILL.md" || { echo "❌ Missing web/skills/liki/SKILL.md"; exit 1; }
          test -f "web/skills/liki/VERSION" || { echo "❌ Missing web/skills/liki/VERSION"; exit 1; }
          test -f "web/skills/liki/bazi/tools/skill-tools.json" || { echo "❌ Missing tools/skill-tools.json"; exit 1; }
          test -f "web/skills/liki/bazi/tools/agent_cli.py" || { echo "❌ Missing tools/agent_cli.py"; exit 1; }
          test -f "web/skills/liki/webapp/mingshu/generate.md" || { echo "❌ Missing webapp/mingshu"; exit 1; }
          echo "✓ 统一 liki skill 结构完整（SKILL.md + VERSION + bazi 工具链/webapp）"

      # skill pytest 不在无服务阶段跑——由 ml8s/liki 仓库 CI（单测）与 make test-all Docker E2E 段（全量含 integration）负责

      - name: Validate version file
        run: |
          test -f cmd/liki/VERSION || { echo "❌ Missing cmd/liki/VERSION"; exit 1; }
          echo "✓ VERSION: $(cat cmd/liki/VERSION)"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # 官方 Action + 锁 v2（v1.64.8 对 go.mod 声明的 Go 1.26.6 官方不支持，go install 方式官方不推荐）
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.13.1
          args: --timeout=3m

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out ./... -coverpkg=./internal/...

      - name: Check coverage
        run: |
          COV=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Coverage: ${COV}%"
          if [ "$(echo "$COV < 50" | bc)" -eq 1 ]; then
            echo "Coverage ${COV}% is below 50% threshold"
            exit 1
          fi

      - name: Build
        run: make build-go

  docker-build:
    runs-on: ubuntu-latest
    needs: go-check
    steps:
      - uses: actions/checkout@v7
      # skills 准备（结构校验 + 指纹防假同步）统一在 composite action
      - uses: ./.github/actions/prepare-skills
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build binary
        run: make build-go
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        run: docker build -f deploy/liki/Dockerfile -t liki:ci .
        env:
          DOCKER_BUILDKIT: 1

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
        continue-on-error: true

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: HTML check
        run: node web/scripts/check-html.cjs
      - name: Check static sync
        run: node web/scripts/check-static-sync.cjs

      - name: Build web assets
        run: make build-web

      - name: i18n check
        run: node web/scripts/check-i18n.cjs

      - name: Run Vitest
        run: cd web && npx vitest run

  e2e:
    runs-on: ubuntu-latest
    needs: go-check
    steps:
      - uses: actions/checkout@v7

      # skills 准备（结构校验 + 指纹防假同步）统一在 composite action
      - uses: ./.github/actions/prepare-skills

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24.14.1'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Node deps
        run: cd web && npm ci

      - name: Install Playwright browsers
        run: cd web && npx playwright install chromium

      - name: Install Caddy
        run: |
          curl -sfL "https://caddyserver.com/api/download?os=linux&arch=amd64" -o caddy
          chmod +x caddy

      - name: Build Go server
        run: make build-go

      - name: Build web assets
        run: make build-web

      - name: Start servers
        env:
          JWT_SECRET: liki-ci-e2e
          DEEPSEEK_API_KEY: ci-test-dummy
          LLM_MODEL: ci-test-dummy
          XUNHU_APPID: ci-test-dummy
          XUNHU_APPSECRET: ci-test-dummy
          PAYMENTS_WEBHOOK_URL: http://localhost:8081/api/payments/webhook
          LIKI_WEB_HOST: localhost
          LIKI_ENGINE_HOST: localhost
        run: |
          mkdir -p /tmp/liki-e2e && chmod 777 /tmp/liki-e2e
          HEPAN_DB_PATH=/tmp/liki-e2e/hepan.db ./bin/liki-web -addr :8081 -db /tmp/liki-e2e/liki.db &
          # Wait for Go server to be ready before starting Caddy (avoids 503 on reverse_proxy)
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8081/api/health 2>/dev/null | grep -q '"ok"'; then
              echo "Go server ready"
              break
            fi
            sleep 1
          done
          if [ "$i" = "10" ]; then echo "Go server failed to start" >&2; exit 1; fi
          ./caddy run --config deploy/liki/Caddyfile.local &
          # Wait for Caddy to be ready (static files + API proxy)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/zh-Hans/ 2>/dev/null | grep -q '<html'; then
              if curl -sf http://localhost:8080/api/health 2>/dev/null | grep -q '"ok"'; then
                echo "Server ready"
                break
              fi
            fi
            sleep 2
          done
          if [ "$i" = "30" ]; then echo "Server failed to start" >&2; exit 1; fi

      - name: Run page tests
        run: cd web && BASE_URL=http://localhost:8080 npx playwright test --config e2e/playwright.config.js journeys/pages.spec.js

      - name: Run full E2E
        run: cd web && BASE_URL=http://localhost:8080 npx playwright test --config e2e/playwright.config.js --ignore-snapshots

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: web/test-results/
