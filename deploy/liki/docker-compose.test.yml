# Liki — 本地 Docker 部署测试
# 仅映射 8080:80，使用 Caddyfile.local (auto_https off)
# 通过 make test-local 调用，不直接使用

services:
  engine:
    image: liki-engine:latest
    build:
      context: ../../../liki/engine
      dockerfile: deploy/Dockerfile
    expose: ["8082"]
    restart: "no"
    environment:
      - LISTEN_ADDR=:8082
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'

  web:
    image: liki-web:latest
    build:
      context: ../..
      dockerfile: deploy/liki/Dockerfile
    expose: ["8081"]
    restart: "no"
    env_file:
      - .env
    environment:
      - LISTEN_ADDR=:8081
      - DB_PATH=/var/lib/liki/liki.db
      - LIKI_ENGINE_URL=http://engine:8082/jsonrpc
      - LIKI_SELF_URL=http://127.0.0.1:8081
      - LIKI_SKILLS_DIR=/web/skills
    volumes:
      - liki_data:/var/lib/liki
      - web_data:/web:ro
    depends_on:
      engine:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2'

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    environment:
      - DOMAIN=${DOMAIN:-liki.hk}
      - CADDY_LISTEN_ADDR=:80
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_started
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  liki_data:
    name: liki_data
  caddy_data:
    name: liki_caddy_data
  web_data:
    name: liki-web_data
