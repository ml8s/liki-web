# Liki — AI Chinese Metaphysics Service
# Architecture: engine (JSON-RPC) + web (API + frontend) + caddy (reverse proxy)
# Build:  docker compose -f deploy/liki/docker-compose.yml build
# Start:  docker compose -f deploy/liki/docker-compose.yml up -d

services:
  engine:
    image: liki-engine:latest
    build:
      context: ../../../liki-skills/engine
      dockerfile: deploy/Dockerfile
    expose: ["8082"]
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=:8082
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'

  web:
    image: liki-web:latest
    build:
      context: ../..
      dockerfile: deploy/liki/Dockerfile
    expose: ["8081"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LISTEN_ADDR=:8081
      - DB_PATH=/var/lib/liki/liki.db
      - LIKI_ENGINE_URL=http://engine:8082/jsonrpc
      - LIKI_SKILLS_DIR=/web/skills
      - LIKI_RPC_URL=http://engine:8082/jsonrpc
      - FEEDBACK_API_KEY=REDACTED-LEAKED-KEY
    volumes:
      - liki_data:/var/lib/liki
    depends_on:
      engine:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2'

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-liki.hk}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  liki_data:
    name: liki_data
  caddy_data:
