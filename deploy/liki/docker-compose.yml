# Liki — AI Chinese Metaphysics Service
# Architecture: engine (JSON-RPC) + web (API + frontend) + caddy (reverse proxy)
# Build:  docker compose -f deploy/liki/docker-compose.yml build
# Start:  docker compose -f deploy/liki/docker-compose.yml up -d

services:
  engine:
    image: liki-engine:latest
    build:
      context: ../../../liki/engine
      dockerfile: deploy/Dockerfile
    expose: ["8082"]
    restart: unless-stopped
    environment:
      - LISTEN_ADDR=:8082
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1'

  web:
    image: liki-web:latest
    build:
      context: ../..
      dockerfile: deploy/liki/Dockerfile
    expose: ["8081"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LISTEN_ADDR=:8081
      - DB_PATH=/var/lib/liki/liki.db
      - LIKI_ENGINE_URL=http://engine:8082/jsonrpc
      - LIKI_SELF_URL=http://127.0.0.1:8081
      - LIKI_SKILLS_DIR=/web/skills
      - LIKI_RPC_URL=http://engine:8082/jsonrpc
      - FEEDBACK_API_KEY=${FEEDBACK_API_KEY}
    volumes:
      - liki_data:/var/lib/liki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      engine:
        condition: service_started
        # engine 为 scratch 镜像（无 shell/wget，无法运行探活命令）——保持 started；
        # web 自身 /api/health 会暴露依赖问题
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '2'

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-liki.hk}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_healthy   # 反代在 web 就绪后才接入（started ≠ 可服务）
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

volumes:
  liki_data:
    name: liki_data
  caddy_data:
